<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV 播放器</title>
    <style>body,html{margin:0;padding:0;width:100%;height:100%;background-color:#000;overflow:hidden}#dplayer{width:100%;height:100%}</style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dplayer@1.27.1/dist/DPlayer.min.js"></script>
</head>
<body>
    <div id="dplayer"></div>
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const rawUrl = urlParams.get('url');
            const title = urlParams.get('title') || 'IPTV 直播';
            if (!rawUrl) { document.body.innerHTML = '<div style="color:white;text-align:center;padding-top:20%;font-size:24px;">无效的播放地址</div>'; return; }
            document.title = title;
            let type = 'auto';
            if (rawUrl.includes('.m3u8') || rawUrl.includes('/hls')) type = 'hls';
            else if (rawUrl.includes('.ts') || rawUrl.includes('/stream') || rawUrl.includes('mpegts')) type = 'flv';
            console.log('播放:', rawUrl, type);
            const dp = new DPlayer({
                container: document.getElementById('dplayer'),
                live: true, autoplay: true, screenshot: true,
                video: {
                    url: rawUrl, type: type,
                    customType: {
                        'flv': function (video, player) {
                            if (mpegts.getFeatureList().mseLivePlayback) {
                                const mpegtsPlayer = mpegts.createPlayer({ type: 'mpegts', isLive: true, url: video.src, enableStashBuffer: false, liveBufferLatencyChasing: true });
                                mpegtsPlayer.attachMediaElement(video);
                                mpegtsPlayer.load();
                                player.events.on('destroy', () => mpegtsPlayer.destroy());
                            }
                        },
                        'hls': function (video, player) {
                             if (Hls.isSupported()) {
                                const hls = new Hls(); hls.loadSource(video.src); hls.attachMedia(video);
                                player.events.on('destroy', () => hls.destroy());
                            } else if (video.canPlayType('application/vnd.apple.mpegurl')) { video.src = video.src; }
                        }
                    }
                }
            });
        })();
    </script>
</body>
</html>
