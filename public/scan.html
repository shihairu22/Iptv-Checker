<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>频道哨兵 | 扫描队列</title>
<link rel="icon" type="image/png" href="/Sentinel.png">
<link rel="shortcut icon" type="image/png" href="/Sentinel.png">
<link rel="apple-touch-icon" href="/Sentinel.png">
<script>
  document.documentElement.classList.add('auth-pending');
</script>
<script>
  try {
    const k = localStorage.getItem('iptv:theme');
    const t = k || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  } catch (e) {}
</script>
<link href="/vendor/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
<link href="/vendor/bootstrap-icons/1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/theme-tokens.css" rel="stylesheet">
<link href="css/shadcn-ui.css" rel="stylesheet">
<link href="css/scan.css" rel="stylesheet">
<script src="/js/core/api-client.js"></script>
<script src="/js/core/auth-gate.js"></script>
<script src="/js/theme-manager.js"></script>
<script src="/js/top-nav-loader.js" defer></script>
<script src="/js/scan/scan-page.js" defer></script>
</head>
<body data-nav-page="scan">
<div id="topNavMount"></div>

<div class="container py-3 scan-wrap">

  <div class="d-flex align-items-center flex-wrap gap-2 mb-1">
    <h5 class="mb-0 scan-title"><i class="bi bi-broadcast-pin me-2"></i>扫描队列</h5>
    <span class="badge scan-state" id="stateBadge" data-state="idle">空闲</span>
    <span class="small text-secondary ms-1" id="taskMeta"></span>
    <div class="ms-auto d-flex gap-2">
      <a class="btn btn-sm btn-outline-secondary" href="/"><i class="bi bi-house me-1"></i>回主页</a>
      <a class="btn btn-sm btn-outline-secondary" href="/results"><i class="bi bi-collection-play me-1"></i>频道</a>
    </div>
  </div>
  <p class="small text-secondary mb-3">
    大批量地址 / 网段扫描交给后台队列：进度可查、可停可续，服务重启后自动接着跑。
    小列表仍可用主页的即时检测。
  </p>

  <div class="alert d-none" id="pageAlert" role="alert"></div>

  <div class="row g-3">
    <!-- 左：参数 + 日志 -->
    <div class="col-xl-7">
      <div class="card scan-card">
        <div class="card-header scan-card-head">
          <i class="bi bi-sliders me-2"></i>任务参数
        </div>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label small mb-1">udpxy 服务器</label>
              <div class="input-group input-group-sm">
                <select class="form-select" id="udpxySelect" style="max-width:280px;"></select>
                <input type="text" class="form-control addr-mono" id="udpxyUrl" placeholder="http://ip:port">
              </div>
              <div class="form-text">列表来自「设置 → 应用设置 → udpxy 服务器」，也可直接改地址。</div>
            </div>

            <div class="col-12">
              <label class="form-label small mb-1">扫描方式</label>
              <div class="btn-group btn-group-sm w-100" role="group">
                <input type="radio" class="btn-check" name="scanType" id="typeBatch" value="batch" checked>
                <label class="btn btn-outline-secondary" for="typeBatch"><i class="bi bi-card-list me-1"></i>批量列表</label>
                <input type="radio" class="btn-check" name="scanType" id="typeRange" value="range">
                <label class="btn btn-outline-secondary" for="typeRange"><i class="bi bi-arrows-expand me-1"></i>网段范围</label>
              </div>
            </div>

            <div class="col-12" id="batchPane">
              <div class="d-flex align-items-center mb-1">
                <label class="form-label small mb-0">地址列表</label>
                <div class="ms-auto d-flex gap-2">
                  <button class="btn btn-sm btn-outline-secondary" type="button" id="importBtn">
                    <i class="bi bi-upload me-1"></i>导入文件
                  </button>
                  <button class="btn btn-sm btn-outline-secondary" type="button" id="clearBatchBtn">
                    <i class="bi bi-eraser me-1"></i>清空
                  </button>
                  <input type="file" id="importFile" accept=".txt,.m3u,.m3u8" hidden>
                </div>
              </div>
              <textarea class="form-control addr-mono" id="batchInput" rows="10"
                placeholder="每行一个，支持：# 注释、名称,地址、[1-3] 括号展开&#10;例如：&#10;CCTV1,rtp://239.255.0.1:5000&#10;rtp://239.255.0.2:5000&#10;rtp://239.255.0.[10-20]:5000"></textarea>
              <div class="form-text" id="batchCount">0 行有效地址</div>
            </div>

            <div class="col-12 d-none" id="rangePane">
              <div class="row g-2">
                <div class="col-12 col-md-5">
                  <label class="form-label small mb-1">起始地址</label>
                  <input type="text" class="form-control form-control-sm addr-mono" id="startUrl" placeholder="rtp://239.76.253.246:9000">
                </div>
                <div class="col-12 col-md-5">
                  <label class="form-label small mb-1">结束地址</label>
                  <input type="text" class="form-control form-control-sm addr-mono" id="endUrl" placeholder="rtp://239.76.253.248:9020">
                </div>
                <div class="col-12 col-md-2">
                  <label class="form-label small mb-1">端口</label>
                  <input type="text" class="form-control form-control-sm addr-mono" id="ports" placeholder="9000,9020">
                </div>
              </div>
              <div class="form-text" id="rangeCount">按起始/结束地址逐行展开；端口可选，留空用地址里的端口。</div>
            </div>

            <div class="col-6 col-md-3">
              <label class="form-label small mb-1">并发</label>
              <input type="number" class="form-control form-control-sm" id="concurrencyInput" min="1" max="200" value="20">
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label small mb-1">重试次数</label>
              <input type="number" class="form-control form-control-sm" id="retryInput" min="0" max="5" value="0">
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label small mb-1 d-flex align-items-center gap-2">
                <input class="form-check-input mt-0" type="checkbox" id="throttleEnabled">
                <span>分时段节流</span>
              </label>
              <div class="input-group input-group-sm">
                <span class="input-group-text">跑</span>
                <input type="number" class="form-control" id="throttleRun" min="1" value="30">
                <span class="input-group-text">分 / 停</span>
                <input type="number" class="form-control" id="throttlePause" min="1" value="10">
                <span class="input-group-text">分</span>
              </div>
            </div>
          </div>

          <hr class="my-3">

          <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-primary btn-sm px-3" id="startBtn"><i class="bi bi-play-fill me-1"></i>开始扫描</button>
            <button class="btn btn-outline-danger btn-sm" id="stopBtn" disabled><i class="bi bi-stop-fill me-1"></i>停止</button>
            <button class="btn btn-outline-primary btn-sm" id="resumeBtn" disabled><i class="bi bi-arrow-clockwise me-1"></i>继续</button>
            <span class="ms-auto small text-secondary align-self-center" id="formHint"></span>
          </div>
        </div>
      </div>

      <div class="card scan-card mt-3">
        <div class="card-header scan-card-head d-flex align-items-center">
          <span><i class="bi bi-terminal me-2"></i>运行日志</span>
          <span class="ms-auto small text-secondary" id="logCount">0 条</span>
        </div>
        <div class="card-body p-0">
          <pre class="scan-log mb-0" id="logBox">暂无日志</pre>
        </div>
      </div>
    </div>

    <!-- 右：进度 + 失败明细 -->
    <div class="col-xl-5">
      <div class="card scan-card">
        <div class="card-header scan-card-head"><i class="bi bi-speedometer2 me-2"></i>进度</div>
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-baseline mb-2">
            <span class="scan-percent" id="progressText">0%</span>
            <span class="small text-secondary" id="elapsed">用时 00:00</span>
          </div>
          <div class="progress scan-progress" role="progressbar">
            <div class="progress-bar" id="progressBar" style="width:0%"></div>
          </div>

          <div class="row g-2 mt-3 text-center">
            <div class="col-4"><div class="scan-stat"><div class="v" id="statTotal">0</div><div class="k">总数</div></div></div>
            <div class="col-4"><div class="scan-stat"><div class="v" id="statPending">0</div><div class="k">待处理</div></div></div>
            <div class="col-4"><div class="scan-stat"><div class="v" id="statInflight">0</div><div class="k">进行中</div></div></div>
            <div class="col-6"><div class="scan-stat ok"><div class="v" id="statSuccess">0</div><div class="k">在线</div></div></div>
            <div class="col-6"><div class="scan-stat bad"><div class="v" id="statFailed">0</div><div class="k">失败</div></div></div>
          </div>

          <div class="small text-secondary mt-3 d-none" id="throttleRow">
            <i class="bi bi-hourglass-split me-1"></i><span id="throttleState">--</span>
          </div>
        </div>
      </div>

      <div class="card scan-card mt-3">
        <div class="card-header scan-card-head d-flex align-items-center">
          <span><i class="bi bi-x-octagon me-2"></i>失败明细</span>
          <div class="ms-auto d-flex gap-2">
            <button class="btn btn-sm btn-outline-secondary" id="refreshFailBtn" title="刷新"><i class="bi bi-arrow-repeat"></i></button>
            <button class="btn btn-sm btn-outline-primary" id="retryFailedBtn" title="把失败项打回待处理并重扫"><i class="bi bi-arrow-counterclockwise me-1"></i>重扫失败</button>
          </div>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive scan-fail-wrap">
            <table class="table table-sm mb-0 scan-fail-table">
              <thead>
                <tr><th>地址</th><th style="width:56px">次数</th><th style="width:120px">原因</th></tr>
              </thead>
              <tbody id="failBody">
                <tr><td colspan="3" class="text-secondary small">暂无失败项</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <p class="small text-secondary mt-3 mb-0">
    提示：队列与进度存在本地 SQLite，浏览器关掉不影响；服务重启后打开本页即可看到续跑状态。
  </p>
</div>
</body>
</html>
